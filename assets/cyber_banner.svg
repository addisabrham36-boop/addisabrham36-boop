<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Scanline Filter -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ff66" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 8px #00ff66); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px #00e5ff); }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(260px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .glow-text {
        font-family: 'Fira Code', monospace, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
        font-weight: 900;
        letter-spacing: 4px;
        fill: url(#neonGreen);
        animation: pulseGlow 3s infinite ease-in-out;
      }
      .sub-text {
        font-family: 'Fira Code', monospace, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
        font-weight: 600;
        letter-spacing: 2px;
        fill: #8be9fd;
        font-size: 13px;
      }
      .badge-text {
        font-family: 'Fira Code', monospace, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
        font-weight: 700;
        font-size: 11px;
        fill: #00ff66;
      }
      .skull-path {
        fill: none;
        stroke: url(#neonGreen);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: pulseGlow 3s infinite ease-in-out;
      }
      .hud-line {
        stroke: #00ff66;
        stroke-opacity: 0.4;
        stroke-width: 1;
      }
      .scanner-beam {
        animation: scanline 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="850" height="260" rx="10" fill="url(#bgGrad)" stroke="#00ff66" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Cyber Grid -->
  <rect width="850" height="260" rx="10" fill="url(#gridPattern)" />

  <!-- Corner HUD Accents -->
  <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#00ff66" stroke-width="2.5" />
  <path d="M 835 35 L 835 15 L 815 15" fill="none" stroke="#00ff66" stroke-width="2.5" />
  <path d="M 15 225 L 15 245 L 35 245" fill="none" stroke="#00ff66" stroke-width="2.5" />
  <path d="M 835 225 L 835 245 L 815 245" fill="none" stroke="#00ff66" stroke-width="2.5" />

  <!-- Top System Header -->
  <text x="35" y="32" class="badge-text">[ SEC_LEVEL: 0 // ROOT_PRIVILEGES ]</text>
  <text x="710" y="32" class="badge-text" style="fill: #00e5ff;">ARCH_LINUX // x86_64</text>
  <line x1="35" y1="40" x2="815" y2="40" class="hud-line" />

  <!-- Left: Cyber Skull Vector Logo -->
  <g transform="translate(65, 60)">
    <!-- Skull Outer Hologram Ring -->
    <circle cx="65" cy="65" r="62" stroke="#00ff66" stroke-width="1" stroke-dasharray="4, 4" stroke-opacity="0.6" />
    <circle cx="65" cy="65" r="55" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" />

    <!-- Detailed Cyber Skull Icon -->
    <!-- Cranium / Head -->
    <path class="skull-path" d="M 35 50 C 35 25, 95 25, 95 50 C 95 62, 90 70, 85 75 L 85 92 L 45 92 L 45 75 C 40 70, 35 62, 35 50 Z" />
    
    <!-- Eye Sockets -->
    <path class="skull-path" fill="#00ff66" fill-opacity="0.25" d="M 48 55 C 48 48, 58 48, 58 55 C 58 62, 48 62, 48 55 Z" />
    <path class="skull-path" fill="#00ff66" fill-opacity="0.25" d="M 72 55 C 72 48, 82 48, 82 55 C 82 62, 72 62, 72 55 Z" />
    
    <!-- Nose Cavity -->
    <polygon points="65,65 61,74 69,74" fill="#00ff66" opacity="0.8" />
    
    <!-- Teeth / Jaw Grid -->
    <line x1="52" y1="84" x2="52" y2="92" stroke="#00ff66" stroke-width="2" />
    <line x1="60" y1="84" x2="60" y2="92" stroke="#00ff66" stroke-width="2" />
    <line x1="68" y1="84" x2="68" y2="92" stroke="#00ff66" stroke-width="2" />
    <line x1="76" y1="84" x2="76" y2="92" stroke="#00ff66" stroke-width="2" />

    <!-- Crosshairs -->
    <line x1="65" y1="0" x2="65" y2="15" stroke="#00ff66" stroke-width="1.5" />
    <line x1="65" y1="115" x2="65" y2="130" stroke="#00ff66" stroke-width="1.5" />
    <line x1="0" y1="65" x2="15" y2="65" stroke="#00ff66" stroke-width="1.5" />
    <line x1="115" y1="65" x2="130" y2="65" stroke="#00ff66" stroke-width="1.5" />
  </g>

  <!-- Right: Main Typography & Branding -->
  <g transform="translate(230, 80)">
    <!-- Title -->
    <text x="0" y="32" font-size="34" class="glow-text">ABRHAM ADDIS</text>
    
    <!-- Subtitle -->
    <text x="0" y="62" class="sub-text">CYBERSECURITY STUDENT &amp; SELF-LEARNER</text>
    
    <!-- Terminal Divider -->
    <line x1="0" y1="78" x2="580" y2="78" class="hud-line" />

    <!-- Badges Row -->
    <g transform="translate(0, 95)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="26" rx="4" fill="#00ff66" fill-opacity="0.1" stroke="#00ff66" stroke-width="1" />
      <text x="14" y="17" class="badge-text">🛡️ PENTESTING</text>

      <!-- Badge 2 -->
      <rect x="145" y="0" width="150" height="26" rx="4" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="1" />
      <text x="160" y="17" class="badge-text" style="fill: #00e5ff;">📡 NETWORK IDS</text>

      <!-- Badge 3 -->
      <rect x="310" y="0" width="125" height="26" rx="4" fill="#ff79c6" fill-opacity="0.1" stroke="#ff79c6" stroke-width="1" />
      <text x="325" y="17" class="badge-text" style="fill: #ff79c6;">🚩 CTF PLAYER</text>

      <!-- Badge 4 -->
      <rect x="450" y="0" width="125" height="26" rx="4" fill="#bd93f9" fill-opacity="0.1" stroke="#bd93f9" stroke-width="1" />
      <text x="462" y="17" class="badge-text" style="fill: #bd93f9;">🐧 ARCH LINUX</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <line x1="35" y1="225" x2="815" y2="225" class="hud-line" />
  <circle cx="45" cy="240" r="4" fill="#00ff66" style="animation: blink 1.5s infinite;" />
  <text x="56" y="244" class="badge-text" style="font-size: 10px; fill: #a0a8b8;">SYSTEM INTEGRITY: 100% // ALL AUDIT MODULES ARMED</text>
  <text x="695" y="244" class="badge-text" style="font-size: 10px; fill: #00ff66;">[ READY FOR CTF ]</text>
</svg>
